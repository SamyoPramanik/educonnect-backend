version: '3.8'
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/educonnect
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: yoursfskjdfhskdfsnfjknvjksnkjnvjksdnjnsdfjknsdfsdnfsjnfjkndsfkjsndfjnsdkgjgiegjesngsjnsjn
    depends_on:
      - db
    volumes:
      - ./api/src:/app/src
      - ./api/pom.xml:/app/pom.xml
  db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=educonnect
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    driver: local
services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/educonnect
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: yoursfskjdfhskdfsnfjknvjksnkjnvjksdnjnsdfjknsdfsdnfsjnfjkndsfkjsndfjnsdkgjgiegjesngsjnsjn
    depends_on:
      - db
    volumes:
      - ./auth-service/src:/app/src
      - ./auth-service/pom.xml:/app/pom.xml
    networks:
      - app_network
  education-service:
    build:
      context: ./education-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/educonnect
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: yoursfskjdfhskdfsnfjknvjksnkjnvjksdnjnsdfjknsdfsdnfsjnfjkndsfkjsndfjnsdkgjgiegjesngsjnsjn
    depends_on:
      - db
      - auth-service
    volumes:
      - ./education-service/src:/app/src
      - ./education-service/pom.xml:/app/pom.xml
    networks:
      - app_network
  db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=educonnect
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

volumes:
  db_data:
    driver: local

networks:
  app_network:
    driver: bridge